<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Force fresh HTML on every visit so portal updates land without staff having to hard-refresh. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Medina Recruitment Consultant — Helper Profiles</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --teal:#0D7377; --dark:#0A1628; --cream:#F5F7FA;
    --white:#fff; --border:#E2E8F0; --muted:#64748B;
    --green:#059669; --green-bg:#ecfdf5;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Outfit',sans-serif; background:var(--cream); color:var(--dark); min-height:100vh; }

  /* LOGIN */
  .login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:linear-gradient(135deg,#0A1628 0%,#1E3A5F 100%); }
  .login-card { background:#fff; border-radius:24px; padding:48px 36px; max-width:420px; width:100%; box-shadow:0 24px 80px rgba(0,0,0,0.40); text-align:center; }
  .login-card .sub { color:var(--muted); font-size:13px; margin-bottom:28px; margin-top:4px; }
  .login-card input { width:100%; padding:14px 16px; border:1.5px solid var(--border); border-radius:12px; font-family:'Outfit',sans-serif; font-size:15px; margin-bottom:14px; color:var(--dark); background:#fff; }
  .login-card input::placeholder { color:#94a3b8; }
  .login-card input:focus { outline:none; border-color:var(--teal); }
  .login-card button { width:100%; padding:14px; background:linear-gradient(135deg,#0D7377,#0a9396); color:var(--white); border:none; border-radius:12px; font-family:'Outfit',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:opacity 0.2s; }
  .login-card button:hover { opacity:0.9; }
  .login-card button:disabled { opacity:0.5; }
  .login-card .err { color:#dc2626; font-size:13px; margin-top:8px; display:none; }

  /* HEADER — dark navy so white logo text is visible */
  .header {
    background:linear-gradient(135deg,#0A1628 0%,#1E3A5F 100%);
    padding:16px 28px;
    display:flex;
    align-items:center;
    gap:16px;
    box-shadow:0 2px 16px rgba(0,0,0,0.20);
  }
  .header-logo { height:260px; display:block; }
  .header-text h1 { font-size:18px; font-weight:700; color:#fff; }
  .header-text .sub { color:#94a3b8; font-size:12px; margin-top:2px; }

  /* FILTERS */
  .filters {
    padding:14px 20px;
    background:var(--white);
    border-bottom:1px solid var(--border);
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    position:sticky; top:0; z-index:10;
  }
  .filters input, .filters select {
    padding:10px 14px; border:1.5px solid var(--border);
    border-radius:10px; font-family:'Outfit',sans-serif; font-size:13px; color:var(--dark);
  }
  .filters input { flex:1; min-width:200px; }
  .filters input:focus, .filters select:focus { outline:none; border-color:var(--teal); }
  .filters select { min-width:150px; }
  .count-badge { margin-left:auto; background:var(--green-bg); color:var(--green); font-size:12px; font-weight:700; padding:6px 14px; border-radius:20px; white-space:nowrap; }

  /* GRID */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; padding:24px; }
  .card { background:var(--white); border-radius:16px; overflow:hidden; border:1.5px solid var(--border); transition:all 0.2s; cursor:pointer; }
  .card:hover { border-color:var(--teal); box-shadow:0 6px 24px rgba(13,115,119,0.12); transform:translateY(-3px); }
  .card-photo { width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top center; background:#e2e8f0; display:block; }
  .card-photo-placeholder { width:100%; aspect-ratio:3/4; background:linear-gradient(135deg,#e2e8f0,#f1f5f9); display:flex; align-items:center; justify-content:center; font-size:64px; color:#cbd5e1; }
  .card-body { padding:14px 16px 16px; }
  .card-name { font-weight:700; font-size:15px; color:var(--dark); margin-bottom:2px; line-height:1.3; }
  .card-code { font-size:12px; color:var(--teal); font-weight:600; margin-bottom:6px; letter-spacing:0.3px; }
  .card-tags { display:flex; flex-wrap:wrap; gap:5px; }
  .tag { padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .tag-nat   { background:#f0f9ff; color:#0369a1; }
  .tag-age   { background:#f5f3ff; color:#6d28d9; }
  .tag-exp   { background:#fff7ed; color:#c2410c; font-weight:700; }
  .tag-rel   { background:#f0fdf4; color:#15803d; }
  .tag-avail { background:var(--green-bg); color:var(--green); }
  .tag-skill { background:#fdf4ff; color:#7e22ce; font-weight:700; }

  /* PROFILE DETAIL */
  .profile-overlay { position:fixed; inset:0; background:rgba(10,22,40,0.65); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
  .profile-card { background:var(--white); border-radius:20px; max-width:820px; width:100%; margin:20px auto; box-shadow:0 24px 64px rgba(0,0,0,0.20); }
  .profile-header { display:flex; gap:24px; padding:24px; border-bottom:1px solid var(--border); background:linear-gradient(135deg,#f0fdf4,#f0f9ff); border-radius:20px 20px 0 0; }
  .profile-photo { width:190px; height:250px; border-radius:14px; object-fit:cover; object-position:top center; border:3px solid var(--white); box-shadow:0 4px 16px rgba(0,0,0,0.12); flex-shrink:0; }
  .profile-photo-placeholder { width:190px; height:250px; border-radius:14px; background:linear-gradient(135deg,#e2e8f0,#f1f5f9); display:flex; align-items:center; justify-content:center; font-size:72px; color:#94a3b8; flex-shrink:0; }
  .profile-info { flex:1; }
  .profile-info h2 { font-size:24px; font-weight:700; color:var(--dark); margin-bottom:4px; }
  .profile-info .code { color:var(--teal); font-weight:600; font-size:13px; margin-bottom:12px; }
  .profile-info-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .profile-body { padding:20px 24px; }
  .profile-section { margin-bottom:20px; }
  .profile-section-title { font-weight:700; font-size:11px; color:var(--teal); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid #f0fdfa; }
  .profile-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; font-size:13px; }
  .profile-grid .label { color:var(--muted); font-size:11px; margin-bottom:1px; }
  .profile-grid .value { font-weight:600; color:var(--dark); }
  .profile-close { position:absolute; top:16px; right:16px; background:rgba(0,0,0,0.08); border:none; width:32px; height:32px; border-radius:50%; font-size:18px; cursor:pointer; color:var(--dark); display:flex; align-items:center; justify-content:center; line-height:1; }
  .profile-close:hover { background:rgba(0,0,0,0.14); }
  .profile-actions { padding:16px 24px; border-top:1px solid var(--border); display:flex; gap:10px; flex-wrap:wrap; }
  .profile-actions button { flex:1; min-width:140px; padding:12px; border-radius:10px; font-family:'Outfit',sans-serif; font-size:14px; font-weight:600; cursor:pointer; border:none; transition:opacity 0.2s; }
  .profile-actions button:hover { opacity:0.85; }
  .btn-enquire { background:linear-gradient(135deg,#0D7377,#0a9396); color:var(--white); }
  .btn-download { background:#f1f5f9; color:var(--dark); }
  .btn-delete { background:#fee2e2; color:#dc2626; }

  .work-desc { margin-top:8px; font-size:12px; color:#475569; background:#f8fafc; padding:10px 14px; border-radius:10px; border-left:3px solid var(--teal); line-height:1.6; }

  .empty { text-align:center; padding:80px 20px; color:var(--muted); }
  .empty .icon { font-size:56px; margin-bottom:16px; }

  /* AI SEARCH */
  .ai-panel { max-height:0; overflow:hidden; transition:max-height 0.3s ease; background:linear-gradient(135deg,#f0fdfa,#f0f9ff); border-bottom:1px solid var(--border); }
  .ai-panel.open { max-height:500px; }
  .ai-inner { max-width:800px; margin:0 auto; padding:20px; }
  .ai-textarea { width:100%; min-height:100px; padding:14px; border:1.5px solid var(--border); border-radius:12px; font-family:'Outfit',sans-serif; font-size:13px; line-height:1.6; resize:vertical; color:var(--dark); background:#fff; }
  .ai-textarea:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(13,115,119,0.1); }
  .ai-textarea::placeholder { color:#94a3b8; }
  .ai-actions { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  .ai-btn { padding:10px 24px; background:linear-gradient(135deg,#0D7377,#0a9396); color:#fff; border:none; border-radius:10px; font-family:'Outfit',sans-serif; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .ai-btn:hover { opacity:0.9; }
  .ai-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .ai-match { display:inline-block; padding:3px 8px; border-radius:6px; font-size:10px; font-weight:700; margin-top:6px; line-height:1.3; }
  .ai-match-high { background:#ecfdf5; color:#059669; }
  .ai-match-med { background:#fffbeb; color:#d97706; }
  .ai-match-low { background:#f0f9ff; color:#0369a1; }
  .ai-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .ai-chip { display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; line-height:1.4; }
  .ai-chip-free { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
  .ai-login-box { background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:16px; margin-top:12px; max-width:360px; }
  .ai-login-box input { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px; font-family:'Outfit',sans-serif; font-size:13px; margin-bottom:8px; }
  .ai-login-box input:focus { outline:none; border-color:var(--teal); }

  /* MANAGE MODE */
  .card.selectable { cursor:pointer; position:relative; }
  .card.selectable:hover { border-color:#f97316; }
  .card.selected-card { border-color:#dc2626; box-shadow:0 0 0 3px rgba(220,38,38,0.15); }
  .card-checkbox { position:absolute; top:10px; left:10px; width:22px; height:22px; border-radius:6px; border:2px solid #fff; background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; z-index:2; transition:all 0.15s; }
  .selected-card .card-checkbox { background:#dc2626; border-color:#dc2626; }

  @media (max-width:600px) {
    .header { padding:12px 16px; }
    .header-logo { height:56px; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:14px; }
    .profile-header { flex-direction:column; align-items:center; text-align:center; }
    .profile-photo, .profile-photo-placeholder { width:130px; height:170px; }
    .profile-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <img src="logo-login.png" alt="Medina Recruitment Consultant" style="width:100%;max-width:320px;margin-bottom:8px">
    <div class="sub">Helper Profiles — Enter your access password</div>
    <input type="password" id="pwInput" placeholder="Enter password" onkeydown="if(event.key==='Enter')validateAccess()">
    <button id="loginBtn" onclick="validateAccess()">View Helpers</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- MAIN PORTAL -->
<div id="portal" style="display:none">
  <div class="header">
    <img src="logo.png" alt="Medina" class="header-logo">
    <div class="header-text">
      <h1>Medina Recruitment Consultant</h1>
      <div class="sub">Available Helpers — Browse and enquire</div>
    </div>
  </div>
  <!-- AI Search Panel (admin only, injected by JS) -->
  <div class="ai-panel" id="aiPanel">
    <div class="ai-inner">
      <div style="font-weight:700;font-size:14px;margin-bottom:6px;color:var(--dark)">🤖 AI Helper Search</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Describe your client's requirements — care needs, age, body type, cooking, experience, availability, etc.</div>
      <textarea class="ai-textarea" id="aiInput" placeholder="e.g. Elderly care - nearly 90yo in wheelchair, needs someone who can cook, prefer slim build, age 35-45, expected arrival mid July"></textarea>
      <div class="ai-actions">
        <button class="ai-btn" id="aiBtn" onclick="runAiSearch()">🔍 Find Matching Helpers</button>
        <button onclick="clearAiResults()" style="padding:10px 16px;background:#fff;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)">Clear</button>
        <span id="aiStatus" style="font-size:12px;color:var(--muted);margin-left:auto"></span>
      </div>
      <div id="aiChips" class="ai-chips"></div>
      <div id="aiLoginBox" style="display:none" class="ai-login-box">
        <div style="font-size:12px;font-weight:600;color:var(--dark);margin-bottom:8px">Sign in to use AI Search</div>
        <input type="email" id="aiEmail" placeholder="Email">
        <input type="password" id="aiPassword" placeholder="Password" onkeydown="if(event.key==='Enter')aiLogin()">
        <button class="ai-btn" onclick="aiLogin()" style="width:100%;justify-content:center">Sign In</button>
        <div id="aiLoginErr" style="font-size:12px;color:#dc2626;margin-top:6px;display:none"></div>
      </div>
    </div>
  </div>

  <div class="filters">
    <button onclick="toggleAiPanel()" id="aiToggleBtn" style="display:none;padding:8px 16px;background:linear-gradient(135deg,#0D7377,#0a9396);border:none;color:#fff;border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">🤖 AI Search</button>
    <input type="text" id="searchInput" placeholder="🔍  Search by name, nationality..." oninput="renderHelpers()">
    <input type="number" id="filterHeightMin" placeholder="Min height (cm)" min="140" max="180" oninput="renderHelpers()" style="width:130px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;color:var(--dark)">
    <div style="display:flex;align-items:center;gap:6px">
      <input type="number" id="filterAgeMin" placeholder="Min age" min="18" max="60" oninput="renderHelpers()" style="width:90px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;color:var(--dark)">
      <span style="color:var(--muted);font-size:13px">–</span>
      <input type="number" id="filterAgeMax" placeholder="Max age" min="18" max="60" oninput="renderHelpers()" style="width:90px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;color:var(--dark)">
    </div>
    <select id="filterExp" onchange="renderHelpers()">
      <option value="">All Experience</option>
      <option value="sg">Singapore</option>
      <option value="hk">Hong Kong</option>
      <option value="tw">Taiwan</option>
      <option value="my">Malaysia</option>
      <option value="me">Middle East</option>
      <option value="fresh">Fresh (Home Country Only)</option>
    </select>
    <select id="filterSkill" onchange="renderHelpers()">
      <option value="">All Skills</option>
      <option value="skill_elderly">Elder Care</option>
      <option value="skill_infant">Child Care</option>
      <option value="skill_cooking">Cooking</option>
      <option value="skill_housework">General Housework</option>
    </select>
    <div class="count-badge" id="resultCount"></div>
    <!-- Build stamp — bump on every helpers.html change so screenshots show which version is loaded. -->
    <div style="font-size:10px;color:#94a3b8;margin-left:8px" title="Portal build version">v2026.07.08-profiles</div>
  </div>

  <!-- ADMIN BULK BAR (admin only) -->
  <div id="adminBar" style="display:none;padding:10px 20px;background:#fff7ed;border-bottom:1px solid #fed7aa;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <button onclick="toggleManageMode()" id="manageBtn" style="padding:8px 16px;border-radius:8px;border:1.5px solid #c2410c;background:#fff;color:#c2410c;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer">☑ Manage Profiles</button>
    <div id="bulkActions" style="display:none;align-items:center;gap:10px">
      <button onclick="selectAllHelpers()" style="padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--dark);font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer">Select All</button>
      <button onclick="deselectAllHelpers()" style="padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--dark);font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer">Deselect All</button>
      <span id="selectedCount" style="font-size:13px;color:var(--muted);font-weight:600">0 selected</span>
      <button onclick="deleteSelected()" id="deleteSelectedBtn" style="padding:8px 18px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;opacity:0.4" disabled>🗑 Delete Selected</button>
      <button onclick="toggleManageMode()" style="padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer">Cancel</button>
    </div>
  </div>

  <div class="grid" id="helperGrid"></div>
</div>

<script>
const SUPABASE_URL = 'https://lyikuogxcogsutpskdwb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5aWt1b2d4Y29nc3V0cHNrZHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MTM1MzEsImV4cCI6MjA4ODE4OTUzMX0.o4YvvVRBONCtVP8WKlRviBA8jFAmGJaFEBme2jrcha4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allHelpers = [];
let portalToken = null;
let manageMode = false;
let selectedIds = new Set();

const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const isAdmin = params.get('admin') === '1';

// Title case helper — fixes ALL CAPS and inconsistent casing
function toTitle(str) {
  if (!str) return '';
  return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

if (!token) {
  document.getElementById('loginErr').textContent = 'Invalid link — no access token provided.';
  document.getElementById('loginErr').style.display = 'block';
  document.getElementById('pwInput').style.display = 'none';
  document.getElementById('loginBtn').style.display = 'none';
} else if (isAdmin) {
  (async () => {
    try {
      const { data, error } = await sb.from('helper_portal_tokens').select('*').eq('token', token).gte('expires_at', new Date().toISOString()).limit(1);
      if (error) throw error;
      if (data?.length && data[0].password_hash === '__admin__') {
        portalToken = data[0];
        await loadHelpers();
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('portal').style.display = 'block';
      } else {
        document.getElementById('loginErr').textContent = 'Admin token invalid or expired.';
        document.getElementById('loginErr').style.display = 'block';
      }
    } catch (e) {
      document.getElementById('loginErr').textContent = 'Error: ' + e.message;
      document.getElementById('loginErr').style.display = 'block';
    }
  })();
}

async function validateAccess() {
  const pw = document.getElementById('pwInput').value.trim();
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  if (!pw) { err.textContent = 'Please enter the password.'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Verifying...';
  err.style.display = 'none';

  try {
    const { data, error } = await sb.from('helper_portal_tokens')
      .select('*').eq('token', token).gte('expires_at', new Date().toISOString()).limit(1);
    if (error) throw error;
    if (!data?.length) {
      err.textContent = 'Link expired or invalid.'; err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'View Helpers'; return;
    }
    if (data[0].password_hash !== pw) {
      err.textContent = 'Incorrect password.'; err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'View Helpers'; return;
    }
    portalToken = data[0];
    await loadHelpers();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('portal').style.display = 'block';
  } catch (e) {
    err.textContent = 'Error: ' + e.message; err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'View Helpers';
  }
}

async function loadHelpers() {
  const { data, error } = await sb.from('portal_helpers')
    .select('*').eq('status', 'active').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  allHelpers = data || [];
  if (isAdmin) {
    document.getElementById('adminBar').style.display = 'flex';
    document.getElementById('aiToggleBtn').style.display = '';
  }
  renderHelpers();
}

function calcAge(dob) {
  if (!dob) return null;
  return Math.floor((Date.now() - new Date(dob)) / 31557600000);
}

// Treat blanks and biodata placeholders ("None", "No", "No previous experience", etc.)
// as no real experience so the "Ex Singapore"/"Ex Malaysia"/etc. tag only shows when the
// helper genuinely worked in that country. Mirrors the same helper used in medina-crm.
function hasRealExp(val) {
  if (!val) return false;
  const s = String(val).trim().toLowerCase();
  if (!s) return false;
  if (['none','no','n/a','n.a','n.a.','nil','-','—','null','undefined','tidak ada','tidak'].includes(s)) return false;
  if (/^no\b/.test(s)) return false;
  if (/never\s+worked/.test(s)) return false;
  if (/no\s+(previous|prior|past)\s+experience/.test(s)) return false;
  return true;
}

// Strict-mode keyword detectors for elderly and infant/child care experience.
// English + Indonesian/Malay + Filipino terms so biodata written in helper
// or agency dialect still matches. Cooking and housework intentionally NOT
// gated — every helper is assumed suitable for general housework, and
// cooking is also kept lenient (rating only).
const ELDER_KEYWORDS = /\b(elder(ly|s)?|senior\s*(citizen|s)?|grandm(a|other|um|y)|grandp(a|arent|ops)?|granny|grandfather|stroke|dementia|alzheimer|bedridden|wheelchair|paralyz|aged\s+(person|couple|lady|man)|old\s+(person|woman|man|lady|gentleman|couple|folks?)|oma|opa|lansia|nenek|kakek|warga\s+emas|lola|lolo|matanda)\b/i;
// Child noun keywords. Intentionally exclude broad age phrases like
// "X years old" / "X months old" — those false-positive on biographical
// content like "my children are 5 and 7 years old" or sibling ages.
const CHILD_NOUNS = /\b(child(ren|care)?|kid(s|do)?|infant|baby|babies|toddler|newborn|kindergart|preschool|school[-\s]*(age|going|boy|girl|kid)|young\s+(boy|girl|kid|son|daughter)|anak|bayi|balita|kanak[-\s]*kanak|sanggol|bata|batang)\b/i;
// Caregiving verbs in English + Indonesian/Malay + Filipino. For strict
// child-care mode, one of these must appear in the SAME sentence as a
// child noun — proves the helper actually DID the work, not just lived
// in a household that happened to have kids.
const CHILDCARE_VERBS = /\b(care[ds]?|caring|look(ed|ing)?\s+after|babysit(s|ter|ting)?|babysat|nann(y|ies)|raise[d]?|raising|tend(ed|ing)?|mind(ed|ing)?|help(ed|ing)?|assist(ed|ing)?|supervis(e|ed|ing)|teach|taught|teaching|tutor(ed|ing)?|fed|feed(ing)?|bath(e|ed|ing)|dress(ed|ing)|escort(ed|ing)?|accompan(y|ied|ying)|jaga|asuh(an)?|alaga(an)?|atend(er|ing)?)\b/i;

// Concatenate every text field that might describe what the helper actually did
function buildExperienceText(h) {
  return [h.exp_sg, h.exp_my, h.exp_hk, h.exp_tw, h.exp_me, h.exp_home, h.work_desc]
    .filter(v => hasRealExp(v))
    .join(' \n ');
}

// Strict-mode check for elder / child care.
//   ELDER CARE
//     - experienced: ELDER_KEYWORDS in any work text
//     - fresh: star rating (>=3 enforced upstream) is the only signal
//   CHILD CARE
//     - own children > 0: always passes (parenting = real experience,
//       regardless of work history)
//     - otherwise experienced: CHILDCARE_VERBS + CHILD_NOUNS in same sentence
//     - otherwise fresh + no own kids: excluded
function hasSkillExperience(h, skillCol) {
  const text = buildExperienceText(h);
  const isFresh = !text;
  const ownChildren = parseInt(h.children) || 0;

  if (skillCol === 'skill_elderly') {
    if (isFresh) return true; // star rating already enforced upstream
    return ELDER_KEYWORDS.test(text);
  }
  if (skillCol === 'skill_infant') {
    if (ownChildren > 0) return true; // own children always counts
    if (isFresh) return false; // fresh + no own kids = no evidence
    // Experienced without own kids: caregiving verb must be in SAME
    // sentence as child noun. Avoids "Worked as cleaner. Family had 2
    // children" false positive.
    const sentences = text.split(/[.!?\n]+/);
    return sentences.some(s => CHILD_NOUNS.test(s) && CHILDCARE_VERBS.test(s));
  }
  return true; // cooking / housework / others: not gated
}

function renderHelpers() {
  const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const exp = document.getElementById('filterExp')?.value || '';
  const heightMin = parseInt(document.getElementById('filterHeightMin')?.value) || null;

  let filtered = allHelpers.filter(h => {
    if (aiResults && !aiResults[h.id]) return false;
    if (search && !(h.full_name||'').toLowerCase().includes(search) &&
        !(h.fdw_code||'').toLowerCase().includes(search) &&
        !(h.nationality||'').toLowerCase().includes(search)) return false;
    if (heightMin) {
      const ht = parseFloat(String(h.height||'').replace(/\s*cm$/i,'')) || 0;
      if (!ht || ht < heightMin) return false;
    }

    // Age range filter
    const ageMin = parseInt(document.getElementById('filterAgeMin')?.value) || null;
    const ageMax = parseInt(document.getElementById('filterAgeMax')?.value) || null;
    if (ageMin || ageMax) {
      const age = calcAge(h.dob);
      if (!age) return false;
      if (ageMin && age < ageMin) return false;
      if (ageMax && age > ageMax) return false;
    }

    // Skill filter — rating ≥3 plus, for elderly/infant, STRICT MODE:
    // experience text must mention real elder/child care work (keyword match).
    // Cooking and housework stay rating-only (every helper assumed suitable for
    // general housework, and cooking is judged by self-rated skill).
    const skill = document.getElementById('filterSkill')?.value || '';
    if (skill) {
      const v = parseInt(h[skill]);
      if (isNaN(v) || v < 3) return false;
      if ((skill === 'skill_elderly' || skill === 'skill_infant') && !hasSkillExperience(h, skill)) return false;
    }

    // Experience filter
    // Use hasRealExp() so the filter agrees with the Ex-Country tag display —
    // both ignore biodata placeholders like "No previous Singapore experience".
    if (exp === 'sg' && !hasRealExp(h.exp_sg)) return false;
    if (exp === 'hk' && !hasRealExp(h.exp_hk)) return false;
    if (exp === 'tw' && !hasRealExp(h.exp_tw)) return false;
    if (exp === 'my' && !hasRealExp(h.exp_my)) return false;
    if (exp === 'me' && !hasRealExp(h.exp_me)) return false;
    if (exp === 'fresh' && (hasRealExp(h.exp_sg) || hasRealExp(h.exp_hk) || hasRealExp(h.exp_tw) || hasRealExp(h.exp_my) || hasRealExp(h.exp_me))) return false;

    return true;
  });
  if (aiResults) {
    filtered.sort((a, b) => (aiResults[a.id]?.rank || 999) - (aiResults[b.id]?.rank || 999));
  }

  document.getElementById('resultCount').textContent = filtered.length + ' helper' + (filtered.length !== 1 ? 's' : '') + ' found';

      <div class="empty" style="grid-column:1/-1">

        <h3 style="font-size:18px;margin-bottom:6px">No helpers found</h3>
        <p>Try a different search or filter.</p>
      </div>`;
    return;
  }

  document.getElementById('helperGrid').innerHTML = filtered.map(h => {
    const age = calcAge(h.dob);
    const name = toTitle(h.full_name) || '—';
    const nat = toTitle(h.nationality) || '';

    return `
    <div class="card ${manageMode ? 'selectable' : ''} ${selectedIds.has(h.id) ? 'selected-card' : ''}" data-id="${h.id}" onclick="${manageMode ? `toggleSelect('${h.id}')` : `openProfile('${h.id}')`}">
      ${manageMode ? `<div class="card-checkbox">${selectedIds.has(h.id) ? '✓' : ''}</div>` : ''}
      ${h.photo_url

        <div class="card-tags">

  if (selectedIds.size === 0) return;
  const names = [...selectedIds].map(id => {
    const h = allHelpers.find(x => x.id === id);

  });
  if (!confirm(`Delete ${selectedIds.size} helper(s)?\n\n${names.join('\n')}\n\nThis cannot be undone.`)) return;
  const btn = document.getElementById('deleteSelectedBtn');
  btn.textContent = 'Deleting...'; btn.disabled = true;
  const ids = [...selectedIds];

  selectedIds.clear();

const CLAUDE_PROXY = 'https://claude-proxy.hilmi-zdin.workers.dev';
let aiResults = null;
let aiSession = null;

// Normalise any Indonesian region/province name (stored value OR AI criterion)
// to one canonical key so "Jawa Barat" / "West Java" / "Sunda" all match.
// Stored portal regions are: West Java, East Java, Central Java, Sumatra,
// Bali/NTB/NTT, Sulawesi, Jakarta.
function canonRegion(raw) {
  const s = (raw || '').toLowerCase().trim();
  if (!s) return '';
  if (/jawa\s*barat|jabar|west\s*java|sunda|bandung|bogor|bekasi|cirebon|karawang|sukabumi|tasik|subang|ciamis|garut|cianjur/.test(s)) return 'west java';
  if (/jawa\s*timur|jatim|east\s*java|surabaya|malang|blitar|kediri|banyuwangi|jember|madiun|pasuruan|mojokerto|tulungagung|sidoarjo/.test(s)) return 'east java';
  if (/jawa\s*tengah|jateng|central\s*java|semarang|cilacap|banyumas|kebumen|brebes|blora|banjarnegara|kulonprogo/.test(s)) return 'central java';
  if (/sumatra|sumatera|lampung|medan|padang|palembang|jambi|riau|aceh|bengkulu/.test(s)) return 'sumatra';
  if (/\bbali\b|ntb|ntt|lombok|bima|dompu|mataram|nusa\s*tenggara/.test(s)) return 'bali/ntb/ntt';
  if (/sulawesi|makassar|manado/.test(s)) return 'sulawesi';
  if (/jakarta|dki/.test(s)) return 'jakarta';
  return s; // unknown — compare literally
}

function helperBmi(h) {
  const ht = parseFloat(String(h.height||'').replace(/\s*cm$/i,'')) || 0;
  const wt = parseFloat(String(h.weight||'').replace(/\s*kg$/i,'')) || 0;
  if (!ht || !wt) return { bmi: null, build: null };
  const bmi = Math.round(wt / ((ht/100) ** 2) * 10) / 10;
  const build = bmi < 18.5 ? 'underweight' : bmi < 23 ? 'slim' : bmi < 25 ? 'average' : bmi < 30 ? 'heavy' : 'very heavy';
  return { bmi, build };
}

// Call the Claude proxy with automatic retry on transient "Overloaded" /
// rate-limit errors (Anthropic returns these under load). Exponential
// backoff 1s -> 2s -> 4s. Non-transient errors throw immediately.
async function callClaude(bodyObj, token, statusEl) {
  const MAX_ATTEMPTS = 4;
  let lastErr = '';
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    let result = null, httpStatus = 0;
    try {
      const resp = await fetch(CLAUDE_PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(bodyObj),
      });
      httpStatus = resp.status;
      result = await resp.json();
    } catch (e) {
      lastErr = e.message || 'Network error';
    }
    if (result && !result.error) return result;
    const errMsg = result && result.error ? (result.error.message || JSON.stringify(result.error)) : lastErr;
    const errType = result && result.error ? (result.error.type || '') : '';
    lastErr = errMsg || ('HTTP ' + httpStatus) || 'AI request failed';
    const transient = !result
      || [429, 500, 502, 503, 529].includes(httpStatus)
      || /overload|rate.?limit|capacity|temporarily|try again/i.test(errMsg + ' ' + errType);
    if (!transient || attempt === MAX_ATTEMPTS) throw new Error(lastErr);
    const waitMs = 1000 * Math.pow(2, attempt - 1);   // 1s, 2s, 4s
    if (statusEl) statusEl.textContent = `Anthropic busy — retrying in ${waitMs / 1000}s (${attempt + 1}/${MAX_ATTEMPTS})...`;
    await new Promise(r => setTimeout(r, waitMs));
  }
  throw new Error(lastErr || 'AI request failed');
}

// Minimal HTML escape for chip labels (AI-sourced text may contain <, &, ").
function escChip(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Translate the parsed criteria into plain-language chips. Structured criteria
// become normal chips; free_requirements become distinct "verifying" chips so
// the user sees exactly what was applied as a hard filter vs judged from the
// work history. Returns [] when nothing at all was understood.
function buildCriteriaChips(c) {
  const chips = [];
  const push = (label, free) => chips.push({ label, free: !!free });
  if (c.age_min && c.age_max) push(`age ${c.age_min}–${c.age_max}`);
  else if (c.age_min) push(`age ≥ ${c.age_min}`);
  else if (c.age_max) push(`age ≤ ${c.age_max}`);
  if (Array.isArray(c.birth_years) && c.birth_years.length) push(`born ${c.birth_years.join(', ')}`);
  if (c.build === 'slim') push('slim build');
  const skillLabel = { elderly: 'elderly care', infant: 'child care', cooking: 'cooking', housework: 'housework', disabled: 'disabled care' };
  if (Array.isArray(c.skills_required)) c.skills_required.forEach(s => push(`${skillLabel[s] || s} skill ≥3`));
  const cc = { sg: 'Singapore', my: 'Malaysia', hk: 'Hong Kong', tw: 'Taiwan', me: 'Middle East', home: 'home country' };
  const cn = code => cc[code] || code;
  if (Array.isArray(c.experience) && c.experience.length) push(`worked in: ${c.experience.map(cn).join(' + ')}`);
  if (Array.isArray(c.experience_any) && c.experience_any.length) push(`worked in any: ${c.experience_any.map(cn).join(' / ')}`);
  if (Array.isArray(c.experience_exclude) && c.experience_exclude.length) push(`exclude: ${c.experience_exclude.map(cn).join(', ')}`);
  if (c.nationality) push(`nationality: ${c.nationality}`);
  if (c.religion) push(`religion: ${c.religion}`);
  if (c.education) { const em = { senior: 'senior high', junior: 'junior high', elementary: 'elementary' }; push(`education: ${em[c.education] || c.education}`); }
  if (Array.isArray(c.region_include) && c.region_include.length) push(`region: ${c.region_include.join(', ')}`);
  if (Array.isArray(c.region_exclude) && c.region_exclude.length) push(`exclude region: ${c.region_exclude.join(', ')}`);
  // v2 structured criteria — green (hard-fact) chips: applied as a fast pre-filter
  // against enriched profiles, with rank-time verification for un-enriched ones.
  if (c.childcare_max_age != null) push(`children ≤${c.childcare_max_age} yrs (verified profiles)`);
  if (c.min_total_years != null) push(`≥${c.min_total_years} years experience`);
  if (Array.isArray(c.free_requirements)) c.free_requirements.forEach(f => push(`🔎 verifying from work history: ${f}`, true));
  return chips;
}

function renderAiChips(chips) {
  const el = document.getElementById('aiChips');
  if (!el) return;
  el.innerHTML = (chips || []).map(ch =>
    `<span class="ai-chip ${ch.free ? 'ai-chip-free' : ''}">${escChip(ch.label)}</span>`).join('');
}

async function runAiSearch() {
  const query = document.getElementById('aiInput').value.trim();
  if (!query) return;
  const token = await ensureAiAuth();
  if (!token) return;

  const btn = document.getElementById('aiBtn');
  const status = document.getElementById('aiStatus');
  btn.disabled = true; btn.textContent = '⏳ Parsing...';
  status.textContent = 'Step 1/2 — extracting criteria...';

  try {
    // ── STEP 1: Parse query into structured filters (Haiku — fast) ──
    const parseResult = await callClaude({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 500,
        messages: [{ role: 'user', content: [{ type: 'text', text:
          `Extract structured search criteria from this employer request. Return ONLY a JSON object.

"${query}"

Fields (use null if not mentioned):
{"age_min":null,"age_max":null,"birth_years":null,"build":"slim|any","skills_required":["elderly","infant","cooking","housework","disabled"],"experience":["sg","my","hk","tw","me","home"],"experience_any":null,"experience_exclude":null,"nationality":null,"religion":null,"education":null,"region_include":null,"region_exclude":null,"childcare_max_age":null,"min_total_years":null,"free_requirements":[]}

- age_min/age_max: number or null — use ONLY for a continuous age range
- birth_years: array of 4-digit years (e.g. [1994,1996,1999]) when the request lists specific years of birth. Use this — NOT age_min/age_max — whenever specific years are given. Otherwise null.
- build: "slim" if they want slim/fit/small/thin/petite, "any" otherwise
- skills_required: only include skills they explicitly need
- Country codes (used by experience / experience_any / experience_exclude): "sg"=Singapore, "my"=Malaysia, "hk"=Hong Kong, "tw"=Taiwan, "me"=Middle East (Saudi/Jordan/UAE/Dubai/Abu Dhabi/Oman/Qatar/Kuwait/Bahrain), "home"=Indonesia/local/home-country experience.
- experience: AND logic — helper must have worked in EVERY code listed. Use only for a genuine must-have-all (e.g. "worked in both Singapore and Taiwan" -> ["sg","tw"]). NEVER use it for "X or Y".
- experience_any: OR logic — helper must have worked in AT LEAST ONE of these. Use for "experience in X or Y" (e.g. "worked in Indonesia or Malaysia" -> ["home","my"]). Null if not applicable.
- experience_exclude: helper must NOT have worked in any of these. e.g. "no Singapore or Middle East" -> ["sg","me"]. Exclude always wins over include.
- The word "ONLY" after a country list is critical: it means the helper worked in THOSE countries and NOWHERE else. You MUST then set experience_exclude to ALL of the other country codes not listed. The full code set is [sg, my, hk, tw, me, home].
- WORKED EXAMPLE 1: "working experience in Indonesia or Malaysia only" -> experience_any:["home","my"], experience_exclude:["sg","hk","tw","me"], experience:null. (home & my are the wanted ones; the OTHER FOUR codes go in experience_exclude.)
- WORKED EXAMPLE 2: "must have Singapore experience" -> experience:["sg"], experience_any:null, experience_exclude:null.
- WORKED EXAMPLE 3: "no Middle East experience" -> experience_exclude:["me"], everything else null.
- nationality/religion: only if specified
- education: "senior" for SMA/senior high/vocational high, "junior" for SMP/junior high/secondary, "elementary" for SD/elementary/primary. Null otherwise.
- region_include: array of regions the employer WANTS. region_exclude: array of regions they do NOT want (e.g. "not from Jawa Barat" -> region_exclude:["West Java"]). Use null for both if no region mentioned. Map every Indonesian region name to one of these EXACT canonical values: "West Java" (Jawa Barat / Jabar / Sunda / Sundanese / Bandung / Bogor / Bekasi / Cirebon / Karawang / Sukabumi / Tasikmalaya / Subang / Ciamis), "East Java" (Jawa Timur / Jatim / Surabaya / Malang / Blitar / Kediri / Banyuwangi), "Central Java" (Jawa Tengah / Jateng / Semarang / Cilacap / Banyumas / Kebumen / Brebes), "Sumatra" (Lampung / Medan / Padang / Palembang), "Bali/NTB/NTT" (Bali / Lombok / Bima / Dompu / Mataram / NTB / NTT), "Sulawesi", "Jakarta" (DKI Jakarta). Output ONLY these canonical values.
- childcare_max_age: a NUMBER (years) or null. Set it ONLY when the request specifies an age ceiling for the children to be cared for — the oldest a cared-for child may be. Examples: "baby 2 years and below" -> 2, "toddler under 3" -> 3, "infant/newborn" -> 0.5, "children below 12 months" -> 1. Null when no child-age ceiling is stated.
- min_total_years: a NUMBER or null — a minimum TOTAL years of experience. "at least 5 years experience" -> 5, "minimum 3 years" -> 3, "experienced (10+ years)" -> 10. Null when no minimum-years floor is stated.
- free_requirements: an array of strings. Capture EVERY requirement in the request that CANNOT be expressed by any structured field above — verbatim or concisely. This is the safety net: NEVER silently drop a requirement — if it does not fit a structured field, it MUST appear here. Examples of things that belong here: a specific age of child cared for ("children aged 2 or younger"), a minimum total years of experience ("at least 5 years experience"), comfort with pets ("comfortable with large dogs"), a named cuisine or task not covered by the skill flags. Use an empty array [] only when the entire request is fully captured by the structured fields.
- WORKED EXAMPLE 4: "experience handling baby 2 years and below" -> skills_required:["infant"], childcare_max_age:2, free_requirements:["cared for children aged 2 or younger"]. (The infant skill AND the childcare_max_age:2 ceiling are the structured parts; ALSO keep the free_requirement — it stays the evidence-verification net for helpers without a structured profile. All three are set — never dropped.)

Return ONLY the JSON, nothing else.`
        }] }]
    }, token, status);
    const parseText = parseResult.content?.find(c => c.type === 'text')?.text || '';
    const criteriaMatch = parseText.match(/\{[\s\S]*\}/);
    const criteria = criteriaMatch ? JSON.parse(criteriaMatch[0]) : {};
    console.log('[AI search] extracted criteria:', JSON.stringify(criteria));

    // Honest UX: show exactly what was understood as chips (structured criteria
    // + free requirements that will be verified from work history).
    const chips = buildCriteriaChips(criteria);
    renderAiChips(chips);

    // If we understood NOTHING (all fields null/empty and no free requirements),
    // stop before ranking rather than dumping every profile as a "match".
    if (!chips.length) {
      aiResults = null;
      renderHelpers();
      status.textContent = "Couldn't extract any requirements from that — try describing the need differently.";
      btn.disabled = false; btn.textContent = '🔍 Find Matching Helpers';
      return;
    }

    // ── STEP 2: Pre-filter in JavaScript ──
    let candidates = allHelpers.filter(h => {
      const age = calcAge(h.dob);
      if (criteria.age_min && age && age < criteria.age_min) return false;
      if (criteria.age_max && age && age > criteria.age_max) return false;
      // Specific birth-year list — read the year straight off the DOB string
      // (exact, no timezone math). Handles non-contiguous lists that a
      // min/max age range cannot express.
      if (Array.isArray(criteria.birth_years) && criteria.birth_years.length) {
        const by = parseInt((h.dob || '').slice(0, 4));
        if (!by || !criteria.birth_years.map(Number).includes(by)) return false;
      }
      if (criteria.build === 'slim') {
        const { build } = helperBmi(h);
        if (build === 'heavy' || build === 'very heavy') return false;
      }
      if (Array.isArray(criteria.skills_required)) {
        const skillMap = { elderly:'skill_elderly', infant:'skill_infant', cooking:'skill_cooking',
          housework:'skill_housework', disabled:'skill_disabled' };
        for (const sk of criteria.skills_required) {
          const col = skillMap[sk];
          if (!col) continue;
          const v = parseInt(h[col]);
          if (isNaN(v) || v < 3) return false;
          // Strict mode mirror: elder/infant must also have real text evidence
          if ((col === 'skill_elderly' || col === 'skill_infant') && !hasSkillExperience(h, col)) return false;
        }
      }
      // Experience include (must-have) + exclude (must-NOT-have). expMap covers
      // overseas postings plus "home" = Indonesia/home-country experience.
      // hasExp() ignores junk placeholders ("NO"/"none"/"-") so a literal "NO"
      // in exp_sg isn't mistaken for real Singapore experience.
      const expMap = { sg:'exp_sg', my:'exp_my', hk:'exp_hk', tw:'exp_tw', me:'exp_me', home:'exp_home' };
      // Use the SAME detector the card badges use (hasRealExp) so the filter and
      // the "Ex Singapore"/"Ex Middle East" tags agree perfectly — a helper the
      // filter keeps can never still show an excluded-country badge.
      const hasExp = (code) => { const col = expMap[code]; return col ? hasRealExp(h[col]) : false; };
      // Exclude wins: drop anyone who worked in an unwanted country.
      if (Array.isArray(criteria.experience_exclude)) {
        for (const ex of criteria.experience_exclude) if (hasExp(ex)) return false;
      }
      // AND-include: must have worked in EVERY listed country.
      if (Array.isArray(criteria.experience)) {
        for (const ex of criteria.experience) if (expMap[ex] && !hasExp(ex)) return false;
      }
      // OR-include: must have worked in AT LEAST ONE listed country.
      if (Array.isArray(criteria.experience_any) && criteria.experience_any.length) {
        if (!criteria.experience_any.some(ex => hasExp(ex))) return false;
      }
      if (criteria.nationality && (h.nationality||'').toLowerCase() !== criteria.nationality.toLowerCase()) return false;
      if (criteria.religion && (h.religion||'').toLowerCase() !== criteria.religion.toLowerCase()) return false;
      // Region include/exclude. canonRegion normalises both the helper's stored
      // region and the AI's criterion to one canonical key, so "Jawa Barat",
      // "West Java", "Sunda" all match the same helpers.
      if (Array.isArray(criteria.region_include) && criteria.region_include.length) {
        const hr = canonRegion(h.region);
        if (!criteria.region_include.some(r => canonRegion(r) === hr)) return false;
      }
      if (Array.isArray(criteria.region_exclude) && criteria.region_exclude.length) {
        const hr = canonRegion(h.region);
        if (criteria.region_exclude.some(r => canonRegion(r) === hr)) return false;
      }
      if (criteria.education) {
        const e = (h.education || '').toLowerCase();
        const lvl = criteria.education;
        const ok = (lvl === 'senior' && /sma|senior|vocational/.test(e))
                || (lvl === 'junior' && /smp|junior|secondary/.test(e))
                || (lvl === 'elementary' && /\bsd\b|elementary|primary/.test(e));
        if (!ok) return false;
      }
      // ── v2 STRUCTURED FAST PATH (ai_profile) ──────────────────────────────
      // These drop a helper ONLY on POSITIVE profile evidence that she fails the
      // criterion. A helper with NO ai_profile, or a null childcare/total_years,
      // is NEVER dropped here — she falls through to the rank step where
      // free_requirements are verified against her work history (the honest
      // fallback). ai_profile arrives via the select('*') load, so no schema work.
      if (criteria.childcare_max_age != null && h.ai_profile
          && h.ai_profile.childcare && h.ai_profile.childcare.min_age_cared != null) {
        // Evidence she cared for a child THIS young or younger. Keep if
        // min_age_cared <= ceiling; drop only when the youngest she cared for is
        // still too old.
        if (h.ai_profile.childcare.min_age_cared > criteria.childcare_max_age) return false;
      }
      if (criteria.min_total_years != null && h.ai_profile
          && h.ai_profile.total_years != null) {
        if (h.ai_profile.total_years < criteria.min_total_years) return false;
      }
      return true;
    });

    status.textContent = `Step 2/2 — ranking ${candidates.length} candidates (filtered from ${allHelpers.length})...`;
    btn.textContent = '⏳ Ranking...';

    if (!candidates.length) {
      aiResults = {};
      status.textContent = '0 matches — no helpers meet all criteria';
      renderHelpers();
      btn.disabled = false; btn.textContent = '🔍 Find Matching Helpers';
      return;
    }

    // ── STEP 3: AI ranking of pre-filtered candidates (Haiku — fast) ──
    // Consider EVERY portal profile. The overflow that caused the old "No
    // ranking returned" bug came from the RESPONSE (all candidates ranked)
    // exceeding max_tokens — now bounded by asking for only the TOP 30 matches.
    // With the response bounded, the input no longer needs an arbitrary slice,
    // so this cap sits at the full portal size (180) rather than starving the
    // ranker of candidates.
    const RANK_CAP = 180;
    const totalCandidates = candidates.length;
    const wasCapped = totalCandidates > RANK_CAP;
    if (wasCapped) candidates = candidates.slice(0, RANK_CAP);
    // Use short numeric IDs so the AI can't corrupt UUIDs
    const idMap = {};
    const profiles = candidates.map((h, idx) => {
      const n = idx + 1;
      idMap[n] = h.id;
      const age = calcAge(h.dob);
      const { bmi, build } = helperBmi(h);
      return {
        n, name: h.full_name || '—', age, birth_year: parseInt((h.dob || '').slice(0, 4)) || null, bmi, build,
        region: h.region || null,
        skills: { elderly: h.skill_elderly, infant: h.skill_infant, cooking: h.skill_cooking,
          housework: h.skill_housework, disabled: h.skill_disabled },
        exp: [h.exp_sg?'SG:'+h.exp_sg:'', h.exp_my?'MY:'+h.exp_my:'', h.exp_hk?'HK:'+h.exp_hk:'',
              h.exp_tw?'TW:'+h.exp_tw:'', h.exp_me?'ME:'+h.exp_me:'', h.exp_home?'Home:'+h.exp_home:''].filter(Boolean).join('; ') || 'Fresh',
        cooking: h.cooking_cuisines || null, languages: h.spoken_languages || null,
        // Compact structured facts (v2 ai_profile) so the ranker leans on dense,
        // uniform evidence — child ages cared for, total years, years by country,
        // special notes. null when this helper hasn't been enriched yet (she is
        // still ranked purely on the full "work" text below).
        profile: h.ai_profile ? {
          childcare: h.ai_profile.childcare ? {
            ages: h.ai_profile.childcare.cared_for_ages,
            min_age: h.ai_profile.childcare.min_age_cared,
            newborn: h.ai_profile.childcare.newborn
          } : null,
          total_years: h.ai_profile.total_years ?? null,
          years_by_country: h.ai_profile.years_by_country ?? null,
          special: h.ai_profile.special ?? null
        } : null,
        // FULL work history — this is the evidence the ranker verifies free
        // requirements against (e.g. child ages cared for, years of service).
        // Truncating this (old 150-char cap) starved the ranker of exactly the
        // detail nuanced queries need.
        work: h.work_desc || ''
      };
    });

    const freeReqs = Array.isArray(criteria.free_requirements) ? criteria.free_requirements : [];
    const rankResult = await callClaude({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 4000,
        messages: [{ role: 'user', content: [{ type: 'text', text:
          `Rank these pre-filtered helper candidates for this employer request:
"${query}"

CANDIDATES (already filtered by hard criteria — each has a full "work" history):
${JSON.stringify(profiles)}

${freeReqs.length ? `VERIFICATION DUTIES — these requirements could NOT be encoded as hard filters, so YOU must verify each one against the candidate's "work" text (and other fields):
${freeReqs.map((r, i) => (i + 1) + '. ' + r).join('\n')}
A candidate may score 60 or higher ONLY if their profile text contains ACTUAL EVIDENCE satisfying these requirement(s). If there is no such evidence, score 40 or below. Every returned match MUST include an "evidence" field: a short, near-verbatim quote from that candidate's "work"/profile text that proves the requirement(s) are met.` : `Score each candidate 50-100 on overall fit. Every returned match MUST include an "evidence" field: the single strongest concrete detail from their profile that supports the fit.`}

Return ONLY the TOP 30 best matches as a JSON array, sorted by score descending. Use the "n" field as the identifier. Each entry:
[{"n":1,"score":90,"evidence":"<short near-verbatim quote>","reason":"<lead with that evidence quote, then key stats>"}]
Return ONLY the JSON array — at most 30 entries, nothing else.`
        }] }]
    }, token, status);
    const rankText = rankResult.content?.find(c => c.type === 'text')?.text || '';
    const rankMatch = rankText.match(/\[[\s\S]*\]/);
    if (!rankMatch) throw new Error('No ranking returned — try again, or rephrase the query more specifically');
    let matches;
    try {
      matches = JSON.parse(rankMatch[0]);
    } catch {
      throw new Error('Ranker response was truncated — try a more specific query');
    }
    aiResults = {};
    matches.forEach((m, i) => {
      const realId = idMap[m.n];
      // reason drives the on-card match line; fall back to evidence if the model
      // only returned the quote.
      if (realId) aiResults[realId] = { rank: i + 1, score: m.score, reason: m.reason || m.evidence || '' };
    });
    // Honest result line: N = matches actually RETURNED (≤30, evidence-backed),
    // M = profiles the ranker verified against (the pre-filtered set).
    const nMatches = matches.length;
    status.textContent = `${nMatches} strong match${nMatches !== 1 ? 'es' : ''} · verified against ${totalCandidates} profile${totalCandidates !== 1 ? 's' : ''}`;
    renderHelpers();
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
    console.error('AI search error:', e);
  }
  btn.disabled = false; btn.textContent = '🔍 Find Matching Helpers';
}

async function deletePortalHelper(id, name) {
  if (!confirm('Delete ' + toTitle(name) + ' from portal? This cannot be undone.')) return;
  const { error } = await sb.from('portal_helpers').delete().eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  allHelpers = allHelpers.filter(h => h.id !== id);
  renderHelpers();
  const overlay = document.querySelector('.profile-overlay');
  if (overlay) overlay.remove();
}
