<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medina Recruitment Consultant — Helper Profiles</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --teal:#0D7377; --dark:#0A1628; --cream:#F5F7FA;
    --white:#fff; --border:#E2E8F0; --muted:#64748B;
    --green:#059669; --green-bg:#ecfdf5;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Outfit',sans-serif; background:var(--cream); color:var(--dark); min-height:100vh; }

  /* LOGIN */
  .login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:linear-gradient(135deg,#0A1628 0%,#1E3A5F 100%); }
  .login-card { background:#fff; border-radius:24px; padding:48px 36px; max-width:420px; width:100%; box-shadow:0 24px 80px rgba(0,0,0,0.40); text-align:center; }
  .login-card .sub { color:var(--muted); font-size:13px; margin-bottom:28px; margin-top:4px; }
  .login-card input { width:100%; padding:14px 16px; border:1.5px solid var(--border); border-radius:12px; font-family:'Outfit',sans-serif; font-size:15px; margin-bottom:14px; color:var(--dark); background:#fff; }
  .login-card input::placeholder { color:#94a3b8; }
  .login-card input:focus { outline:none; border-color:var(--teal); }
  .login-card button { width:100%; padding:14px; background:linear-gradient(135deg,#0D7377,#0a9396); color:var(--white); border:none; border-radius:12px; font-family:'Outfit',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:opacity 0.2s; }
  .login-card button:hover { opacity:0.9; }
  .login-card button:disabled { opacity:0.5; }
  .login-card .err { color:#dc2626; font-size:13px; margin-top:8px; display:none; }

  /* HEADER — dark navy so white logo text is visible */
  .header {
    background:linear-gradient(135deg,#0A1628 0%,#1E3A5F 100%);
    padding:16px 28px;
    display:flex;
    align-items:center;
    gap:16px;
    box-shadow:0 2px 16px rgba(0,0,0,0.20);
  }
  .header-logo { height:260px; display:block; }
  .header-text h1 { font-size:18px; font-weight:700; color:#fff; }
  .header-text .sub { color:#94a3b8; font-size:12px; margin-top:2px; }

  /* FILTERS */
  .filters {
    padding:14px 20px;
    background:var(--white);
    border-bottom:1px solid var(--border);
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    position:sticky; top:0; z-index:10;
  }
  .filters input, .filters select {
    padding:10px 14px; border:1.5px solid var(--border);
    border-radius:10px; font-family:'Outfit',sans-serif; font-size:13px; color:var(--dark);
  }
  .filters input { flex:1; min-width:200px; }
  .filters input:focus, .filters select:focus { outline:none; border-color:var(--teal); }
  .filters select { min-width:150px; }
  .count-badge { margin-left:auto; background:var(--green-bg); color:var(--green); font-size:12px; font-weight:700; padding:6px 14px; border-radius:20px; white-space:nowrap; }

  /* GRID */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px; padding:24px; }
  .card { background:var(--white); border-radius:16px; overflow:hidden; border:1.5px solid var(--border); transition:all 0.2s; cursor:pointer; }
  .card:hover { border-color:var(--teal); box-shadow:0 6px 24px rgba(13,115,119,0.12); transform:translateY(-3px); }
  .card-photo { width:100%; aspect-ratio:3/4; object-fit:cover; object-position:top center; background:#e2e8f0; display:block; }
  .card-photo-placeholder { width:100%; aspect-ratio:3/4; background:linear-gradient(135deg,#e2e8f0,#f1f5f9); display:flex; align-items:center; justify-content:center; font-size:64px; color:#cbd5e1; }
  .card-body { padding:14px 16px 16px; }
  .card-name { font-weight:700; font-size:15px; color:var(--dark); margin-bottom:6px; line-height:1.3; }
  .card-tags { display:flex; flex-wrap:wrap; gap:5px; }
  .tag { padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .tag-nat   { background:#f0f9ff; color:#0369a1; }
  .tag-age   { background:#f5f3ff; color:#6d28d9; }
  .tag-exp   { background:#fff7ed; color:#c2410c; font-weight:700; }
  .tag-rel   { background:#f0fdf4; color:#15803d; }
  .tag-avail { background:var(--green-bg); color:var(--green); }
  .tag-skill { background:#fdf4ff; color:#7e22ce; font-weight:700; }

  /* PROFILE DETAIL */
  .profile-overlay { position:fixed; inset:0; background:rgba(10,22,40,0.65); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
  .profile-card { background:var(--white); border-radius:20px; max-width:820px; width:100%; margin:20px auto; box-shadow:0 24px 64px rgba(0,0,0,0.20); }
  .profile-header { display:flex; gap:24px; padding:24px; border-bottom:1px solid var(--border); background:linear-gradient(135deg,#f0fdf4,#f0f9ff); border-radius:20px 20px 0 0; }
  .profile-photo { width:190px; height:250px; border-radius:14px; object-fit:cover; object-position:top center; border:3px solid var(--white); box-shadow:0 4px 16px rgba(0,0,0,0.12); flex-shrink:0; }
  .profile-photo-placeholder { width:190px; height:250px; border-radius:14px; background:linear-gradient(135deg,#e2e8f0,#f1f5f9); display:flex; align-items:center; justify-content:center; font-size:72px; color:#94a3b8; flex-shrink:0; }
  .profile-info { flex:1; }
  .profile-info h2 { font-size:24px; font-weight:700; color:var(--dark); margin-bottom:4px; }
  .profile-info .code { color:var(--teal); font-weight:600; font-size:13px; margin-bottom:12px; }
  .profile-info-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .profile-body { padding:20px 24px; }
  .profile-section { margin-bottom:20px; }
  .profile-section-title { font-weight:700; font-size:11px; color:var(--teal); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid #f0fdfa; }
  .profile-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; font-size:13px; }
  .profile-grid .label { color:var(--muted); font-size:11px; margin-bottom:1px; }
  .profile-grid .value { font-weight:600; color:var(--dark); }
  .profile-close { position:absolute; top:16px; right:16px; background:rgba(0,0,0,0.08); border:none; width:32px; height:32px; border-radius:50%; font-size:18px; cursor:pointer; color:var(--dark); display:flex; align-items:center; justify-content:center; line-height:1; }
  .profile-close:hover { background:rgba(0,0,0,0.14); }
  .profile-actions { padding:16px 24px; border-top:1px solid var(--border); display:flex; gap:10px; flex-wrap:wrap; }
  .profile-actions button { flex:1; min-width:140px; padding:12px; border-radius:10px; font-family:'Outfit',sans-serif; font-size:14px; font-weight:600; cursor:pointer; border:none; transition:opacity 0.2s; }
  .profile-actions button:hover { opacity:0.85; }
  .btn-enquire { background:linear-gradient(135deg,#0D7377,#0a9396); color:var(--white); }
  .btn-download { background:#f1f5f9; color:var(--dark); }
  .btn-delete { background:#fee2e2; color:#dc2626; }

  .work-desc { margin-top:8px; font-size:12px; color:#475569; background:#f8fafc; padding:10px 14px; border-radius:10px; border-left:3px solid var(--teal); line-height:1.6; }

  .empty { text-align:center; padding:80px 20px; color:var(--muted); }
  .empty .icon { font-size:56px; margin-bottom:16px; }

  /* AI SEARCH */
  .ai-panel { max-height:0; overflow:hidden; transition:max-height 0.3s ease; background:linear-gradient(135deg,#f0fdfa,#f0f9ff); border-bottom:1px solid var(--border); }
  .ai-panel.open { max-height:500px; }
  .ai-inner { max-width:800px; margin:0 auto; padding:20px; }
  .ai-textarea { width:100%; min-height:100px; padding:14px; border:1.5px solid var(--border); border-radius:12px; font-family:'Outfit',sans-serif; font-size:13px; line-height:1.6; resize:vertical; color:var(--dark); background:#fff; }
  .ai-textarea:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(13,115,119,0.1); }
  .ai-textarea::placeholder { color:#94a3b8; }
  .ai-actions { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  .ai-btn { padding:10px 24px; background:linear-gradient(135deg,#0D7377,#0a9396); color:#fff; border:none; border-radius:10px; font-family:'Outfit',sans-serif; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .ai-btn:hover { opacity:0.9; }
  .ai-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .ai-match { display:inline-block; padding:3px 8px; border-radius:6px; font-size:10px; font-weight:700; margin-top:6px; line-height:1.3; }
  .ai-match-high { background:#ecfdf5; color:#059669; }
  .ai-match-med { background:#fffbeb; color:#d97706; }
  .ai-match-low { background:#f0f9ff; color:#0369a1; }
  .ai-login-box { background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:16px; margin-top:12px; max-width:360px; }
  .ai-login-box input { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:8px; font-family:'Outfit',sans-serif; font-size:13px; margin-bottom:8px; }
  .ai-login-box input:focus { outline:none; border-color:var(--teal); }

  /* MANAGE MODE */
  .card.selectable { cursor:pointer; position:relative; }
  .card.selectable:hover { border-color:#f97316; }
  .card.selected-card { border-color:#dc2626; box-shadow:0 0 0 3px rgba(220,38,38,0.15); }
  .card-checkbox { position:absolute; top:10px; left:10px; width:22px; height:22px; border-radius:6px; border:2px solid #fff; background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; z-index:2; transition:all 0.15s; }
  .selected-card .card-checkbox { background:#dc2626; border-color:#dc2626; }

  @media (max-width:600px) {
    .header { padding:12px 16px; }
    .header-logo { height:56px; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:14px; }
    .profile-header { flex-direction:column; align-items:center; text-align:center; }
    .profile-photo, .profile-photo-placeholder { width:130px; height:170px; }
    .profile-grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <img src="logo-login.png" alt="Medina Recruitment Consultant" style="width:100%;max-width:320px;margin-bottom:8px">
    <div class="sub">Helper Profiles — Enter your access password</div>
    <input type="password" id="pwInput" placeholder="Enter password" onkeydown="if(event.key==='Enter')validateAccess()">
    <button id="loginBtn" onclick="validateAccess()">View Helpers</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- MAIN PORTAL -->
<div id="portal" style="display:none">
  <div class="header">
    <img src="logo.png" alt="Medina" class="header-logo">
    <div class="header-text">
      <h1>Medina Recruitment Consultant</h1>
      <div class="sub">Available Helpers — Browse and enquire</div>
    </div>
  </div>
  <!-- AI Search Panel (admin only, injected by JS) -->
  <div class="ai-panel" id="aiPanel">
    <div class="ai-inner">
      <div style="font-weight:700;font-size:14px;margin-bottom:6px;color:var(--dark)">🤖 AI Helper Search</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Describe your client's requirements — care needs, age, body type, cooking, experience, availability, etc.</div>
      <textarea class="ai-textarea" id="aiInput" placeholder="e.g. Elderly care - nearly 90yo in wheelchair, needs someone who can cook, prefer slim build, age 35-45, expected arrival mid July"></textarea>
      <div class="ai-actions">
        <button class="ai-btn" id="aiBtn" onclick="runAiSearch()">🔍 Find Matching Helpers</button>
        <button onclick="clearAiResults()" style="padding:10px 16px;background:#fff;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)">Clear</button>
        <span id="aiStatus" style="font-size:12px;color:var(--muted);margin-left:auto"></span>
      </div>
      <div id="aiLoginBox" style="display:none" class="ai-login-box">
        <div style="font-size:12px;font-weight:600;color:var(--dark);margin-bottom:8px">Sign in to use AI Search</div>
        <input type="email" id="aiEmail" placeholder="Email">
        <input type="password" id="aiPassword" placeholder="Password" onkeydown="if(event.key==='Enter')aiLogin()">
        <button class="ai-btn" onclick="aiLogin()" style="width:100%;justify-content:center">Sign In</button>
        <div id="aiLoginErr" style="font-size:12px;color:#dc2626;margin-top:6px;display:none"></div>
      </div>
    </div>
  </div>

  <div class="filters">
    <button onclick="toggleAiPanel()" id="aiToggleBtn" style="display:none;padding:8px 16px;background:linear-gradient(135deg,#0D7377,#0a9396);border:none;color:#fff;border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">🤖 AI Search</button>
    <input type="text" id="searchInput" placeholder="🔍  Search by name, nationality..." oninput="renderHelpers()">
    <input type="number" id="filterHeightMin" placeholder="Min height (cm)" min="140" max="180" oninput="renderHelpers()" style="width:130px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;color:var(--dark)">
    <div style="display:flex;align-items:center;gap:6px">
      <input type="number" id="filterAgeMin" placeholder="Min age" min="18" max="60" oninput="renderHelpers()" style="width:90px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;color:var(--dark)">
      <span style="color:var(--muted);font-size:13px">–</span>
      <input type="number" id="filterAgeMax" placeholder="Max age" min="18" max="60" oninput="renderHelpers()" style="width:90px;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:13px;color:var(--dark)">
    </div>
    <select id="filterExp" onchange="renderHelpers()">
      <option value="">All Experience</option>
      <option value="sg">Singapore</option>
      <option value="hk">Hong Kong</option>
      <option value="tw">Taiwan</option>
      <option value="my">Malaysia</option>
      <option value="me">Middle East</option>
      <option value="fresh">Fresh (Home Country Only)</option>
    </select>
    <select id="filterSkill" onchange="renderHelpers()">
      <option value="">All Skills</option>
      <option value="skill_elderly">Elder Care</option>
      <option value="skill_infant">Child Care</option>
      <option value="skill_cooking">Cooking</option>
      <option value="skill_housework">General Housework</option>
    </select>
    <div class="count-badge" id="resultCount"></div>
  </div>

  <!-- ADMIN BULK BAR (admin only) -->
  <div id="adminBar" style="display:none;padding:10px 20px;background:#fff7ed;border-bottom:1px solid #fed7aa;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <button onclick="toggleManageMode()" id="manageBtn" style="padding:8px 16px;border-radius:8px;border:1.5px solid #c2410c;background:#fff;color:#c2410c;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer">☑ Manage Profiles</button>
    <div id="bulkActions" style="display:none;align-items:center;gap:10px">
      <button onclick="selectAllHelpers()" style="padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--dark);font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer">Select All</button>
      <button onclick="deselectAllHelpers()" style="padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--dark);font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer">Deselect All</button>
      <span id="selectedCount" style="font-size:13px;color:var(--muted);font-weight:600">0 selected</span>
      <button onclick="deleteSelected()" id="deleteSelectedBtn" style="padding:8px 18px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;cursor:pointer;opacity:0.4" disabled>🗑 Delete Selected</button>
      <button onclick="toggleManageMode()" style="padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer">Cancel</button>
    </div>
  </div>

  <div class="grid" id="helperGrid"></div>
</div>

<script>
const SUPABASE_URL = 'https://lyikuogxcogsutpskdwb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5aWt1b2d4Y29nc3V0cHNrZHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI2MTM1MzEsImV4cCI6MjA4ODE4OTUzMX0.o4YvvVRBONCtVP8WKlRviBA8jFAmGJaFEBme2jrcha4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allHelpers = [];
let portalToken = null;
let manageMode = false;
let selectedIds = new Set();

const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const isAdmin = params.get('admin') === '1';

// Title case helper — fixes ALL CAPS and inconsistent casing
function toTitle(str) {
  if (!str) return '';
  return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

if (!token) {
  document.getElementById('loginErr').textContent = 'Invalid link — no access token provided.';
  document.getElementById('loginErr').style.display = 'block';
  document.getElementById('pwInput').style.display = 'none';
  document.getElementById('loginBtn').style.display = 'none';
} else if (isAdmin) {
  (async () => {
    try {
      const { data, error } = await sb.from('helper_portal_tokens').select('*').eq('token', token).gte('expires_at', new Date().toISOString()).limit(1);
      if (error) throw error;
      if (data?.length && data[0].password_hash === '__admin__') {
        portalToken = data[0];
        await loadHelpers();
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('portal').style.display = 'block';
      } else {
        document.getElementById('loginErr').textContent = 'Admin token invalid or expired.';
        document.getElementById('loginErr').style.display = 'block';
      }
    } catch (e) {
      document.getElementById('loginErr').textContent = 'Error: ' + e.message;
      document.getElementById('loginErr').style.display = 'block';
    }
  })();
}

async function validateAccess() {
  const pw = document.getElementById('pwInput').value.trim();
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  if (!pw) { err.textContent = 'Please enter the password.'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Verifying...';
  err.style.display = 'none';

  try {
    const { data, error } = await sb.from('helper_portal_tokens')
      .select('*').eq('token', token).gte('expires_at', new Date().toISOString()).limit(1);
    if (error) throw error;
    if (!data?.length) {
      err.textContent = 'Link expired or invalid.'; err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'View Helpers'; return;
    }
    if (data[0].password_hash !== pw) {
      err.textContent = 'Incorrect password.'; err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'View Helpers'; return;
    }
    portalToken = data[0];
    await loadHelpers();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('portal').style.display = 'block';
  } catch (e) {
    err.textContent = 'Error: ' + e.message; err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'View Helpers';
  }
}

async function loadHelpers() {
  const { data, error } = await sb.from('portal_helpers')
    .select('*').eq('status', 'active').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  allHelpers = data || [];
  if (isAdmin) {
    document.getElementById('adminBar').style.display = 'flex';
    document.getElementById('aiToggleBtn').style.display = '';
  }
  renderHelpers();
}

function calcAge(dob) {
  if (!dob) return null;
  return Math.floor((Date.now() - new Date(dob)) / 31557600000);
}

function renderHelpers() {
  const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const exp = document.getElementById('filterExp')?.value || '';
  const heightMin = parseInt(document.getElementById('filterHeightMin')?.value) || null;

  let filtered = allHelpers.filter(h => {
    if (aiResults && !aiResults[h.id]) return false;
    if (search && !(h.full_name||'').toLowerCase().includes(search) &&
        !(h.fdw_code||'').toLowerCase().includes(search) &&
        !(h.nationality||'').toLowerCase().includes(search)) return false;
    if (heightMin) {
      const ht = parseFloat(String(h.height||'').replace(/\s*cm$/i,'')) || 0;
      if (!ht || ht < heightMin) return false;
    }

    // Age range filter
    const ageMin = parseInt(document.getElementById('filterAgeMin')?.value) || null;
    const ageMax = parseInt(document.getElementById('filterAgeMax')?.value) || null;
    if (ageMin || ageMax) {
      const age = calcAge(h.dob);
      if (!age) return false;
      if (ageMin && age < ageMin) return false;
      if (ageMax && age > ageMax) return false;
    }

    // Skill filter — must have a rating of 3 or above (meaningful experience)
    const skill = document.getElementById('filterSkill')?.value || '';
    if (skill) {
      const v = parseInt(h[skill]);
      if (isNaN(v) || v < 3) return false;
    }

    // Experience filter
    if (exp === 'sg' && !h.exp_sg) return false;
    if (exp === 'hk' && !h.exp_hk) return false;
    if (exp === 'tw' && !h.exp_tw) return false;
    if (exp === 'my' && !h.exp_my) return false;
    if (exp === 'me' && !h.exp_me) return false;
    if (exp === 'fresh' && (h.exp_sg || h.exp_hk || h.exp_tw || h.exp_my || h.exp_me)) return false;

    return true;
  });
  if (aiResults) {
    filtered.sort((a, b) => (aiResults[a.id]?.rank || 999) - (aiResults[b.id]?.rank || 999));
  }

  document.getElementById('resultCount').textContent = filtered.length + ' helper' + (filtered.length !== 1 ? 's' : '') + ' found';

  if (!filtered.length) {
    document.getElementById('helperGrid').innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        <div class="icon">👩</div>
        <h3 style="font-size:18px;margin-bottom:6px">No helpers found</h3>
        <p>Try a different search or filter.</p>
      </div>`;
    return;
  }

  document.getElementById('helperGrid').innerHTML = filtered.map(h => {
    const age = calcAge(h.dob);
    const name = toTitle(h.full_name) || '—';
    const nat = toTitle(h.nationality) || '';
    const rel = toTitle(h.religion) || '';
    return `
    <div class="card ${manageMode ? 'selectable' : ''} ${selectedIds.has(h.id) ? 'selected-card' : ''}" data-id="${h.id}" onclick="${manageMode ? `toggleSelect('${h.id}')` : `openProfile('${h.id}')`}">
      ${manageMode ? `<div class="card-checkbox">${selectedIds.has(h.id) ? '✓' : ''}</div>` : ''}
      ${h.photo_url
        ? `<img class="card-photo" src="${h.photo_url}" alt="${name}" loading="lazy">`
        : `<div class="card-photo-placeholder">${name[0]}</div>`}
      <div class="card-body">
        <div class="card-name">${name}</div>
        <div class="card-tags">
          ${nat ? `<span class="tag tag-nat">${nat}</span>` : ''}
          ${age ? `<span class="tag tag-age">${age} yrs</span>` : ''}
          ${rel ? `<span class="tag tag-rel">${rel}</span>` : ''}
          ${h.exp_sg ? `<span class="tag tag-exp">Ex Singapore</span>` : ''}
          ${h.exp_hk ? `<span class="tag tag-exp">Ex Hong Kong</span>` : ''}
          ${h.exp_tw ? `<span class="tag tag-exp">Ex Taiwan</span>` : ''}
          ${h.exp_my ? `<span class="tag tag-exp">Ex Malaysia</span>` : ''}
          ${h.exp_me ? `<span class="tag tag-exp">Ex Middle East</span>` : ''}
          ${parseInt(h.skill_elderly) >= 3 ? `<span class="tag tag-skill">Elder Care</span>` : ''}
          ${parseInt(h.skill_infant) >= 3 ? `<span class="tag tag-skill">Child Care</span>` : ''}
          ${parseInt(h.skill_cooking) >= 3 ? `<span class="tag tag-skill">Cooking</span>` : ''}
          ${parseInt(h.skill_housework) >= 3 ? `<span class="tag tag-skill">Housework</span>` : ''}
          <span class="tag tag-avail">Available</span>
        </div>
        ${aiResults && aiResults[h.id] ? `<div class="ai-match ${aiResults[h.id].score >= 80 ? 'ai-match-high' : aiResults[h.id].score >= 60 ? 'ai-match-med' : 'ai-match-low'}">#${aiResults[h.id].rank} — ${aiResults[h.id].reason}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

        <button class="btn-enquire" onclick="window.open('https://wa.me/6581802034?text=Hi%20Medina,%20I%20am%20interested%20in%20helper%20${encodeURIComponent(toTitle(h.full_name)||'')}%20(${h.fdw_code||''}).%20Please%20share%20more%20details.','_blank')">💬 Enquire via WhatsApp</button>

function toggleManageMode() {
  manageMode = !manageMode;
  selectedIds.clear();
  const bulkActions = document.getElementById('bulkActions');
  const manageBtn = document.getElementById('manageBtn');
  if (manageMode) {
    bulkActions.style.display = 'flex';
    manageBtn.style.display = 'none';
  } else {
    bulkActions.style.display = 'none';
    manageBtn.style.display = 'inline-block';
  }
  renderHelpers();
}

function toggleSelect(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  const count = selectedIds.size;
  document.getElementById('selectedCount').textContent = count + ' selected';
  const btn = document.getElementById('deleteSelectedBtn');
  btn.disabled = count === 0;
  btn.style.opacity = count === 0 ? '0.4' : '1';
  renderHelpers();
}

function selectAllHelpers() {
  document.querySelectorAll('.card.selectable').forEach(card => {
    const id = card.getAttribute('data-id');
    if (id) selectedIds.add(id);
  });
  // Get ids from current filtered view
  const grid = document.getElementById('helperGrid');
  grid.querySelectorAll('[data-id]').forEach(el => selectedIds.add(el.getAttribute('data-id')));
  const count = selectedIds.size;
  document.getElementById('selectedCount').textContent = count + ' selected';
  const btn = document.getElementById('deleteSelectedBtn');
  btn.disabled = count === 0;
  btn.style.opacity = count === 0 ? '0.4' : '1';
  renderHelpers();
}

function deselectAllHelpers() {
  selectedIds.clear();
  document.getElementById('selectedCount').textContent = '0 selected';
  const btn = document.getElementById('deleteSelectedBtn');
  btn.disabled = true;
  btn.style.opacity = '0.4';
  renderHelpers();
}

async function deleteSelected() {
  if (selectedIds.size === 0) return;
  const names = [...selectedIds].map(id => {
    const h = allHelpers.find(x => x.id === id);
    return h ? toTitle(h.full_name) : id;
  });
  if (!confirm(`Delete ${selectedIds.size} helper(s)?\n\n${names.join('\n')}\n\nThis cannot be undone.`)) return;
  const btn = document.getElementById('deleteSelectedBtn');
  btn.textContent = 'Deleting...'; btn.disabled = true;
  const ids = [...selectedIds];
  const { error } = await sb.from('portal_helpers').delete().in('id', ids);
  if (error) { alert('Failed: ' + error.message); btn.textContent = '🗑 Delete Selected'; btn.disabled = false; return; }
  allHelpers = allHelpers.filter(h => !ids.includes(h.id));
  selectedIds.clear();
  toggleManageMode();
}

// ── AI SEARCH ──────────────────────────────────────────────────────────────
const CLAUDE_PROXY = 'https://claude-proxy.hilmi-zdin.workers.dev';
let aiResults = null;
let aiSession = null;

function toggleAiPanel() {
  const panel = document.getElementById('aiPanel');
  const btn = document.getElementById('aiToggleBtn');
  panel.classList.toggle('open');
  if (panel.classList.contains('open')) {
    btn.style.background = '#059669';
    document.getElementById('aiInput').focus();
  } else {
    btn.style.background = 'linear-gradient(135deg,#0D7377,#0a9396)';
  }
}

function clearAiResults() {
  document.getElementById('aiInput').value = '';
  document.getElementById('aiStatus').textContent = '';
  aiResults = null;
  renderHelpers();
}

async function aiLogin() {
  const email = document.getElementById('aiEmail').value.trim();
  const pw = document.getElementById('aiPassword').value;
  const err = document.getElementById('aiLoginErr');
  if (!email || !pw) { err.textContent = 'Enter email and password'; err.style.display = 'block'; return; }
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    aiSession = data.session;
    document.getElementById('aiLoginBox').style.display = 'none';
    document.getElementById('aiStatus').textContent = 'Signed in — running search...';
    runAiSearch();
  } catch (e) {
    err.textContent = e.message || 'Login failed'; err.style.display = 'block';
  }
}

async function ensureAiAuth() {
  if (aiSession) return aiSession.access_token;
  const { data: { session } } = await sb.auth.getSession();
  if (session) { aiSession = session; return session.access_token; }
  document.getElementById('aiLoginBox').style.display = 'block';
  document.getElementById('aiEmail').focus();
  return null;
}

function helperBmi(h) {
  const ht = parseFloat(String(h.height||'').replace(/\s*cm$/i,'')) || 0;
  const wt = parseFloat(String(h.weight||'').replace(/\s*kg$/i,'')) || 0;
  if (!ht || !wt) return { bmi: null, build: null };
  const bmi = Math.round(wt / ((ht/100) ** 2) * 10) / 10;
  const build = bmi < 18.5 ? 'underweight' : bmi < 23 ? 'slim' : bmi < 25 ? 'average' : bmi < 30 ? 'heavy' : 'very heavy';
  return { bmi, build };
}

async function runAiSearch() {
  const query = document.getElementById('aiInput').value.trim();
  if (!query) return;
  const token = await ensureAiAuth();
  if (!token) return;

  const btn = document.getElementById('aiBtn');
  const status = document.getElementById('aiStatus');
  btn.disabled = true; btn.textContent = '⏳ Parsing...';
  status.textContent = 'Step 1/2 — extracting criteria...';

  try {
    // ── STEP 1: Parse query into structured filters (Haiku — fast) ──
    const parseResp = await fetch(CLAUDE_PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 500,
        messages: [{ role: 'user', content: [{ type: 'text', text:
          `Extract structured search criteria from this employer request. Return ONLY a JSON object.

"${query}"

Fields (use null if not mentioned):
{"age_min":null,"age_max":null,"build":"slim|any","skills_required":["elderly","infant","cooking","housework","disabled"],"experience":["sg","my","hk","tw","me"],"nationality":null,"religion":null}

- age_min/age_max: number or null
- build: "slim" if they want slim/fit/small/thin/petite, "any" otherwise
- skills_required: only include skills they explicitly need
- experience: only include if they want specific country experience
- nationality/religion: only if specified

Return ONLY the JSON, nothing else.`
        }] }]
      })
    });
    const parseResult = await parseResp.json();
    if (parseResult.error) throw new Error(parseResult.error.message || JSON.stringify(parseResult.error));
    const parseText = parseResult.content?.find(c => c.type === 'text')?.text || '';
    const criteriaMatch = parseText.match(/\{[\s\S]*\}/);
    const criteria = criteriaMatch ? JSON.parse(criteriaMatch[0]) : {};

    // ── STEP 2: Pre-filter in JavaScript ──
    let candidates = allHelpers.filter(h => {
      const age = calcAge(h.dob);
      if (criteria.age_min && age && age < criteria.age_min) return false;
      if (criteria.age_max && age && age > criteria.age_max) return false;
      if (criteria.build === 'slim') {
        const { build } = helperBmi(h);
        if (build === 'heavy' || build === 'very heavy') return false;
      }
      if (Array.isArray(criteria.skills_required)) {
        const skillMap = { elderly:'skill_elderly', infant:'skill_infant', cooking:'skill_cooking',
          housework:'skill_housework', disabled:'skill_disabled' };
        for (const sk of criteria.skills_required) {
          const col = skillMap[sk];
          if (col) { const v = parseInt(h[col]); if (isNaN(v) || v < 3) return false; }
        }
      }
      if (Array.isArray(criteria.experience)) {
        const expMap = { sg:'exp_sg', my:'exp_my', hk:'exp_hk', tw:'exp_tw', me:'exp_me' };
        for (const ex of criteria.experience) {
          if (expMap[ex] && !h[expMap[ex]]) return false;
        }
      }
      if (criteria.nationality && (h.nationality||'').toLowerCase() !== criteria.nationality.toLowerCase()) return false;
      if (criteria.religion && (h.religion||'').toLowerCase() !== criteria.religion.toLowerCase()) return false;
      return true;
    });

    status.textContent = `Step 2/2 — ranking ${candidates.length} candidates (filtered from ${allHelpers.length})...`;
    btn.textContent = '⏳ Ranking...';

    if (!candidates.length) {
      aiResults = {};
      status.textContent = '0 matches — no helpers meet all criteria';
      renderHelpers();
      btn.disabled = false; btn.textContent = '🔍 Find Matching Helpers';
      return;
    }

    // ── STEP 3: AI ranking of pre-filtered candidates (Haiku — fast) ──
    // Use short numeric IDs so the AI can't corrupt UUIDs
    const idMap = {};
    const profiles = candidates.map((h, idx) => {
      const n = idx + 1;
      idMap[n] = h.id;
      const age = calcAge(h.dob);
      const { bmi, build } = helperBmi(h);
      return {
        n, name: h.full_name || '—', age, bmi, build,
        skills: { elderly: h.skill_elderly, infant: h.skill_infant, cooking: h.skill_cooking,
          housework: h.skill_housework, disabled: h.skill_disabled },
        exp: [h.exp_sg?'SG:'+h.exp_sg:'', h.exp_my?'MY:'+h.exp_my:'', h.exp_hk?'HK:'+h.exp_hk:'',
              h.exp_me?'ME:'+h.exp_me:'', h.exp_home?'Home:'+h.exp_home:''].filter(Boolean).join('; ') || 'Fresh',
        cooking: h.cooking_cuisines || null, languages: h.spoken_languages || null,
        work: (h.work_desc || '').slice(0, 150)
      };
    });

    const rankResp = await fetch(CLAUDE_PROXY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 8000,
        messages: [{ role: 'user', content: [{ type: 'text', text:
          `Rank these pre-filtered helper candidates for this employer request:
"${query}"

CANDIDATES (already filtered by hard criteria):
${JSON.stringify(profiles)}

You MUST include ALL candidates in your response. Score each 50-100 based on overall fit.
Return ONLY a JSON array sorted by score descending. Use the "n" field as the identifier:
[{"n":1,"score":90,"reason":"Key stats: age X, BMI Y, Z years elderly care experience"}]
Return ONLY the JSON array. Include every candidate.`
        }] }]
      })
    });
    const rankResult = await rankResp.json();
    if (rankResult.error) throw new Error(rankResult.error.message || JSON.stringify(rankResult.error));
    const rankText = rankResult.content?.find(c => c.type === 'text')?.text || '';
    const rankMatch = rankText.match(/\[[\s\S]*\]/);
    if (!rankMatch) throw new Error('No ranking returned');
    const matches = JSON.parse(rankMatch[0]);
    aiResults = {};
    matches.forEach((m, i) => {
      const realId = idMap[m.n];
      if (realId) aiResults[realId] = { rank: i + 1, score: m.score, reason: m.reason };
    });
    status.textContent = matches.length + ' match' + (matches.length !== 1 ? 'es' : '') + ' found (from ' + allHelpers.length + ' profiles)';
    renderHelpers();
  } catch (e) {
    status.textContent = 'Error: ' + e.message;
    console.error('AI search error:', e);
  }
  btn.disabled = false; btn.textContent = '🔍 Find Matching Helpers';
}

async function deletePortalHelper(id, name) {
  if (!confirm('Delete ' + toTitle(name) + ' from portal? This cannot be undone.')) return;
  const { error } = await sb.from('portal_helpers').delete().eq('id', id);
  if (error) { alert('Failed: ' + error.message); return; }
  allHelpers = allHelpers.filter(h => h.id !== id);
  renderHelpers();
  const overlay = document.querySelector('.profile-overlay');
  if (overlay) overlay.remove();
}
